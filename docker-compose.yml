services:

  postgres:
    image: postgres:16
    container_name: apiclientes-postgres
    restart: always
    environment:
      POSTGRES_DB: bd_apiclientes
      POSTGRES_USER: coti
      POSTGRES_PASSWORD: Coti2026
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_apiclientes:/var/lib/postgresql/data
    networks:
      - apiclientes-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: apiclientes-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: Coti2026
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data_apiclientes:/var/lib/pgadmin
    networks:
      - apiclientes-network
    depends_on:
      - postgres

networks:
  apiclientes-network:
    driver: bridge

volumes:
  postgres_data_apiclientes:
  pgadmin_data_apiclientes: